services:
  doctor:
    container_name: doctor
    build:
      dockerfile: docker/Dockerfile
      context: .
      args:
        options: --reload
    image: freelawproject/doctor:latest
    ports:
      - 127.0.0.1:5050:5050
    volumes:
      - .:/opt/app
    env_file:
      - .env.dev
    # Hardening: the service only needs to write to /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
