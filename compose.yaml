services:
  doctor:
    container_name: doctor
    build:
      dockerfile: docker/Dockerfile
      context: .
      args:
        options: --reload
    image: freelawproject/doctor:latest
    ports:
      - 127.0.0.1:5050:5050
    volumes:
      - .:/opt/app
    env_file:
      - .env.dev
    # Hardening, mirroring what the README asks of a production pod.
    # Nothing but /tmp is writable, so an exploit can't alter the code or
    # drop tools; /tmp is an in-memory filesystem that vanishes with the
    # container.
    read_only: true
    tmpfs:
      - /tmp
    # No Linux capabilities: no raw sockets, mounts or ptrace.
    cap_drop:
      - ALL
    # setuid binaries can't grant more privilege than the process has.
    security_opt:
      - no-new-privileges:true
    # Caps the number of processes, so a fork bomb stays in the container.
    pids_limit: 512
