name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Also runs pyrefly via the local hook in .pre-commit-config.yaml, which
      # needs the dependencies installed above.
      - uses: pre-commit/action@v3.0.1

      # The checked modules and files are listed in the project-includes of
      # pyrefly.toml; add them there as they're ready.
      # Pre-existing errors are grandfathered in .pyrefly-baseline.json; only
      # new errors fail the check.
      - name: pyrefly Static Type Checker
        run: uv run pyrefly check
